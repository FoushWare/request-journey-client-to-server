---
# roles/monitoring/tasks/main.yml
# Deploys Prometheus + Grafana + AlertManager via Helm (kube-prometheus-stack)

- name: Create monitoring namespace
  kubernetes.core.k8s:
    name: "{{ k8s_monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Deploy kube-prometheus-stack (Prometheus + Grafana + AlertManager)
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ k8s_monitoring_namespace }}"
    values:
      grafana:
        enabled: true
        adminPassword: "{{ grafana_admin_password }}"
        persistence:
          enabled: true
          size: 5Gi
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                options:
                  path: /var/lib/grafana/dashboards
        sidecar:
          dashboards:
            enabled: true

      prometheus:
        prometheusSpec:
          retention: 30d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 50Gi

      alertmanager:
        config:
          global:
            slack_api_url: "{{ slack_webhook_url | default('') }}"
          route:
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: default
            routes:
              - match:
                  severity: critical
                receiver: pagerduty
          receivers:
            - name: default
              slack_configs:
                - channel: "#alerts"
                  send_resolved: true
            - name: pagerduty
              pagerduty_configs:
                - service_key: "{{ pagerduty_service_key | default('') }}"

- name: Deploy Jaeger (distributed tracing)
  kubernetes.core.helm:
    name: jaeger
    chart_ref: jaegertracing/jaeger
    release_namespace: "{{ k8s_monitoring_namespace }}"
    values:
      collector:
        enabled: true
      query:
        enabled: true
      agent:
        enabled: true
      storage:
        type: elasticsearch
        elasticsearch:
          host: "elasticsearch.{{ k8s_logging_namespace }}.svc.cluster.local"
          port: 9200

- name: Wait for Grafana to be ready
  ansible.builtin.command:
    cmd: "kubectl rollout status deployment/kube-prometheus-stack-grafana -n {{ k8s_monitoring_namespace }} --timeout=300s"
  changed_when: false

- name: Get Grafana service URL
  ansible.builtin.command:
    cmd: "kubectl get svc kube-prometheus-stack-grafana -n {{ k8s_monitoring_namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'"
  register: grafana_url
  changed_when: false

- name: Print Grafana URL
  ansible.builtin.debug:
    msg: "Grafana URL: http://{{ grafana_url.stdout }} (admin / {{ grafana_admin_password }})"
