---
# roles/docker/tasks/main.yml
# Installs Docker Engine and Docker Compose on RHEL/Amazon Linux or Debian/Ubuntu

- name: Detect OS family
  ansible.builtin.setup:
    filter: ansible_os_family

# ─────────────────────────────────────────────────────────────
# Amazon Linux / RHEL
# ─────────────────────────────────────────────────────────────
- name: Install Docker on Amazon Linux / RHEL
  when: ansible_os_family == "RedHat"
  block:
    - name: Install required packages
      ansible.builtin.yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Add Docker CE repository
      ansible.builtin.command:
        cmd: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker CE
      ansible.builtin.yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

# ─────────────────────────────────────────────────────────────
# Debian / Ubuntu
# ─────────────────────────────────────────────────────────────
- name: Install Docker on Debian/Ubuntu
  when: ansible_os_family == "Debian"
  block:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

# ─────────────────────────────────────────────────────────────
# Configure Docker
# ─────────────────────────────────────────────────────────────
- name: Configure Docker daemon
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true,
        "userland-proxy": false
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart Docker

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add ec2-user to docker group (avoid sudo for docker commands)
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Install docker Python library (for Ansible docker modules)
  ansible.builtin.pip:
    name: docker
    state: present
